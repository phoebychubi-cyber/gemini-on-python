
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-on-python"
version = "0.1.1"
description = "A lightweight Python client for the Google Gemini API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Leaftify" }
]
keywords = [
    "gemini",
    "google",
    "ai",
    "api",
    "python",
    "client"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "requests"
]


[tool.hatch.build.targets.wheel]
packages = ["src/gemini"]

[project.urls]
Homepage = "https://github.com/phoebychubi-cyber/gemini-on-python"
Repository = "https://github.com/phoebychubi-cyber/gemini-on-python"
Issues = "https://github.com/phoebychubi-cyber/gemini-on-python/issues/"
